避免更高優先序伴侶覆蓋。", "status": "交叉整理", "evidence": ["ch8_8_1 · L11725"]}, {"category": "風雲史", "number": 13, "id": "30013", "name": "唐門女婿", "route": "小師妹", "note": "取得香囊結緣後，西武林盟主戰勝。", "status": "交叉整理", "evidence": ["ch8_8_1 · L11609"]}, {"category": "風雲史", "number": 14, "id": "30014", "name": "忘憂俠侶", "route": "龍湘", "note": "取得髮簪結緣後，西武林盟主戰勝。", "status": "交叉整理", "evidence": ["ch8_8_1 · L11667"]}, {"category": "風雲史", "number": 15, "id": "30015", "name": "最後的暗器", "route": "首輪優先", "note": "頑抗防守成功、三師兄未死，進入盟主決鬥，勝負皆可；解鎖中旬額外行動。", "status": "交叉整理", "evidence": ["ch8_6_3 · L2959"]}, {"category": "風雲史", "number": 16, "id": "30016", "name": "武林傳奇", "route": "第二階段優先", "note": "成立西武林並戰勝眉山盟主；解鎖骰子收束，讓後續門檻較易控制。", "status": "交叉整理", "evidence": ["ch8_8_1 · L267"]}, {"category": "風雲史", "number": 17, "id": "30017", "name": "飛俠歸來", "route": "第二階段優先", "note": "先救活大師兄，再實際看到歸來；西武林第四年二月，或單身頑抗勝利的汗青46。解鎖下旬額外行動。", "status": "交叉整理", "evidence": ["ch8_4_8_1 · L2905", "ch8_6_3_2 · L7369"]}, {"category": "風雲史", "number": 18, "id": "30018", "name": "魔王的爪牙", "route": "葉雲裳", "note": "取得梳子結緣後，西武林盟主戰勝。", "status": "交叉整理", "evidence": ["ch8_8_1 · L11783"]}, {"category": "風雲史", "number": 19, "id": "30019", "name": "惡人自有惡人磨", "route": "葉雲裳", "note": "救活雲裳後同行武林大會，進入唐門公敵相關分支並讓她相伴；留武林大會前檔。", "status": "交叉整理", "evidence": ["ch6_8_4 · L9373"]}, {"category": "風雲史", "number": 20, "id": "30020", "name": "折梅手", "route": "虞小梅", "note": "完成喚醒、取得髮帶結緣，回唐門後西武林盟主戰勝。", "status": "新版待跑", "evidence": ["ch8_8_1 · L11841"]}, {"category": "風雲史", "number": 21, "id": "30021", "name": "一家之主", "route": "郁竹", "note": "取得手帕結緣後，西武林盟主戰勝。", "status": "新版待跑", "evidence": ["ch8_8_1 · L11899"]}], "docs": {"guide": {"html": "\n<h2 id=\"guide-0\">本攻略的固定前提<\/h2>\n<p>唯一目標是<strong>看遍可取得的劇情分支，蒐集汗青書、生死簿與風雲史<\/strong>。所有長線主幹固定採<strong>普通模式<\/strong>，序章選<strong>「希望人間不要這麼險惡」取得30命運<\/strong>。不安排困難模式挑戰，也不以一次通關或最高戰力為目標。<\/p>\n<p>需要其他序章回應、特殊故事、死亡、低好感或低道德時，另開支檔補完，再回讀主幹。全新帳本沒有繼承配點；普通模式另給3點，序章30點都是劇情資源，不能預支到開局配點。<\/p>\n<p><strong>養成前先看<a href=\"#controls\">數值控管表<\/a>。<\/strong>先保留低數值支檔，再提高主幹能力；特別留意雲裳好感30、二師兄好感、體力35／60、道德20／40／60、門派規模及西武林戰術／學問門檻。當場數值已過高時，重骰通常無法補救直接判定。<\/p>\n<h2 id=\"guide-1\">先理解哪些東西跨周目保存<\/h2>\n<p>汗青書、生死簿、風雲史的取得紀錄存放在全局講經堂資料，與單一劇情存檔分開。這使「在分歧前留檔 → 取得死亡或結局 → 確認講經堂登錄 → 載回分歧前」成為主要收集方式。不要還沒完成結果畫面就強制關閉遊戲。<\/p>\n<p>新開局時才套用繼承獎勵；取得成就後，載回舊劇情存檔，不等於把那個舊檔改造成新的繼承開局。檔案的實際寫入時點與新開局規則見<a href=\"#sources\">資料依據<\/a>。<\/p>\n<p><strong>全新帳本沒有繼承配點。<\/strong>必須先取得風雲史 00「命中有數」。初期死亡、汗青書 6「睡死」或跟四師兄離開等提早結局，不能一律視為完成首周目。<\/p>\n<p>已核對的繼承點數公式：<\/p>\n<p><code>汗青書獎勵 = 20 × min(floor(不同汗青書數 / 5), 8)<\/code><\/p>\n<p><code>生死簿獎勵 = 10 × min(floor(不同生死簿數 / 5), 16)<\/code><\/p>\n<p>另加已取得風雲史的命運獎勵；「命中有數」提供 2 點。重複取得同一編號不會當作另一種收集。劇情中取得的命運是該次冒險資源，不可直接加到下次繼承額度。<\/p>\n<p>例如已有「命中有數」：5 汗青＋5 生死對應 32 點；10 汗青＋10 生死對應 62 點。這些是預算示例，不是每位玩家第一輪保證拿到的數字。<\/p>\n<h2 id=\"guide-2\">推薦路線順序<\/h2>\n<div aria-label=\"可左右捲動的資料表\" class=\"table-wrap\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>階段<\/th>\n<th>主線工作<\/th>\n<th>優先收穫<\/th>\n<th>為什麼先做<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A：零繼承起步<\/td>\n<td>唐門主線，準備小師妹路線；收集沿途短死亡，完成頑抗到底的結局<\/td>\n<td>命中有數、最後的暗器、自戀、一心一意；可順便唐門薪火<\/td>\n<td>下一次開局上、中旬各增加一次行動；不必首輪就解決全部救人條件<\/td>\n<\/tr>\n<tr>\n<td>B：第一條西武林線<\/td>\n<td>以已熟悉的小師妹線為優先；安排大師兄生還<\/td>\n<td>武林傳奇、唐門女婿、飛俠歸來<\/td>\n<td>解鎖收束，並取得下旬額外行動；降低後續骰子壓力<\/td>\n<\/tr>\n<tr>\n<td>C：崆峒／夏侯蘭<\/td>\n<td>奪魄門拜師、雪山、再接西武林<\/td>\n<td>雪山派大弟子；雪山死亡群、恩仇的盡頭、宦海浮沉、傳說之人、失寵<\/td>\n<td>拜師與雪山分歧集中，可用局部重跑大量補項<\/td>\n<\/tr>\n<tr>\n<td>D：不留學／客棧／龍湘<\/td>\n<td>保留雲裳低好感的客棧入口，後期與龍湘結緣<\/td>\n<td>揍我、人間道、忘憂俠侶；客棧死亡群、雞腿大亨<\/td>\n<td>避免雲裳路線自動把客棧入口轉去破廟<\/td>\n<\/tr>\n<tr>\n<td>E：破廟／青城／葉雲裳<\/td>\n<td>先收留葉氏兄妹，再救雲裳<\/td>\n<td>魔王的爪牙、惡人自有惡人磨；破廟、青城、療傷死亡群<\/td>\n<td>點數、醫術與佛學需求較集中，有繼承後容易安排<\/td>\n<\/tr>\n<tr>\n<td>F：崆峒／虞小梅<\/td>\n<td>郁竹返家前置、襄陽、半雨屏救小梅<\/td>\n<td>折梅手；神不在的證明、修仙、掌派人分支、小梅私藏<\/td>\n<td>先取得折梅手，也為之後郁竹線的額外劇情留條件<\/td>\n<\/tr>\n<tr>\n<td>G：崆峒／郁竹<\/td>\n<td>返家、收留、崆峒之變，返回唐門<\/td>\n<td>一家之主；活著、新家、自創武功、千古名匠、醜神仙等<\/td>\n<td>與小梅共享部分前段；但心上人、江陵選擇與後續判定必須分檔<\/td>\n<\/tr>\n<tr>\n<td>H：專門補漏<\/td>\n<td>低體力、低道德、低好感、多重結緣及特殊門派分支<\/td>\n<td>修羅場、分身、鐵琵琶功相關死亡等<\/td>\n<td>避免為少數反向條件破壞主幹存檔<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>這是<strong>工作包順序，不是要求重開七次、每次都從第一年開始<\/strong>。舊檔數值足夠時，先載檔延伸；只有需要新繼承獎勵、早期互斥條件或回頭重跑太長時才重開。<\/p>\n<p>六位伴侶的西武林通關成就在結局程式中為互斥分支：每次執行該結尾只頒發其中一個。多人結緣不能保證一次拿到全部，亦可能壓掉原本想看的滅門結局。<\/p>\n<h2 id=\"guide-3\">A 階段：真正的零存檔開局<\/h2>\n<ol>\n<li>固定選普通模式，腳本會給3命運。第一年六月序章吐血時固定選「希望人間不要這麼險惡」，取得30命運。其他回應只在補劇情支檔查看；主幹不改用15點方案。這些發生在繼承介面之後，不能預先加進配點預算，首次零帳本也不會因此出現繼承配點介面。<\/li>\n<li>開頭照鏡子可解「自戀」。想兼顧其他鏡子選項時，以遊戲允許的最早存檔／劇情回溯點分開做；不要假設所有對話中都能手動存檔。<\/li>\n<li>第一個月先保留低能力檔，收初識唐錚、伙房、買牛／葉家兄妹等短死亡。取得一個就回原檔，不要讓死亡分支接管主幹。<\/li>\n<li>初識人物、月會前置與有期限事件優先於反覆練功。希望以後沿用葉家路線母檔，就在聽到傳聞後一個月內完成收留。<\/li>\n<li>以小師妹為主線時，心上人維持小師妹；第三年五月前準備好感 50 以上與打贏金烏的能力。前期以後山、必經事件與需要的工作養成為主，保留修練秘笈的武學。<\/li>\n<li>第一輪以穩定到結局為優先。頑抗線須在防守戰存活並打到武林盟主，才能取得「最後的暗器」；太早戰死只拿「這是我家」，不能替代它。<\/li>\n<li>留下終戰前檔：先補戰敗結局，再取勝；完成後確認「命中有數」「最後的暗器」均已登錄。<\/li>\n<\/ol>\n<p>戰鬥養成沒有一套通吃所有收集的固定數值：主幹需要能獲勝，死亡支線需要能落敗，部分事件還有體力上限。不要在低體力專用檔解完之前，把所有檔案都養成相同的高能力。<\/p>\n<p>第一輪不強求大師兄立即復活。若採夢中逆天方案，要在該劇情前實際持有 30 命運；預算不足可留待 B 階段，或走醫術與內力的救治條件。<a href=\"https://smilin.net/LoM-wiki/event/detailed_description/4-02-2-飛俠歸來\" rel=\"noopener noreferrer\" target=\"_blank\">救治條件<\/a><\/p>\n<h2 id=\"guide-4\">繼承配點：先買路線門檻，再買效率<\/h2>\n<p>下表來自目前遊戲的配點資料，不是把所有屬性都當成 1 點換 1 點。<\/p>\n<div aria-label=\"可左右捲動的資料表\" class=\"table-wrap\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th style=\"text-align: right;\">每花 1 命運的增量<\/th>\n<th>使用方式<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>體力、內力、輕功、刀劍、拳掌、暗器、嘴力、學問、抗毒、抗麻<\/td>\n<td style=\"text-align: right;\">5<\/td>\n<td>先補近期事件或秘笈門檻，剩餘才補戰鬥<\/td>\n<\/tr>\n<tr>\n<td>性情、處世、道德、修養<\/td>\n<td style=\"text-align: right;\">10，可往兩方向調整<\/td>\n<td>調整兩極屬性也消耗點數；降低屬性不是免費提款<\/td>\n<\/tr>\n<tr>\n<td>銀兩<\/td>\n<td style=\"text-align: right;\">2,500<\/td>\n<td>少量投入可省工作回合；勿讓錢吃掉救人預算<\/td>\n<\/tr>\n<tr>\n<td>武學、門派毒藥、門派暗器資源<\/td>\n<td style=\"text-align: right;\">10<\/td>\n<td>武學是修練資源，不等於直接學會醫術、佛學或戰術<\/td>\n<\/tr>\n<tr>\n<td>一般主要人物好感<\/td>\n<td style=\"text-align: right;\">10，配點介面上限 60<\/td>\n<td>只提高本線所需人物；上限會截斷最後一步增量<\/td>\n<\/tr>\n<tr>\n<td>部分特殊人物好感<\/td>\n<td style=\"text-align: right;\">5，介面上限 20<\/td>\n<td>龍淵、宋悲、申屠龍等使用此類；不能在開局直接點到 30<\/td>\n<\/tr>\n<tr>\n<td>可配點門派好感<\/td>\n<td style=\"text-align: right;\">2，介面上限 6<\/td>\n<td>只處理需要的陣營，不必全面點滿<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>好感使用原始數值表示，避免「幾星」四捨五入造成誤差。所有預算都是<strong>增量<\/strong>；實際初始值以開局介面顯示為準。<\/p>\n<h3 id=\"guide-5\">32 點的小師妹主幹示例<\/h3>\n<div aria-label=\"可左右捲動的資料表\" class=\"table-wrap\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th style=\"text-align: right;\">花費<\/th>\n<th>投入<\/th>\n<th>用途<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td>銀兩＋5,000<\/td>\n<td>買書與事件開銷<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">6<\/td>\n<td>武學＋60<\/td>\n<td>修練所需秘笈<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">3<\/td>\n<td>小師妹好感＋30<\/td>\n<td>接近第三年招親的 50 門檻；沿途仍要維持<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td>三師兄好感＋20<\/td>\n<td>減少早期事件條件壓力<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td>二師兄好感＋20<\/td>\n<td>適用一般主幹；低好感死亡專用檔不加<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">4<\/td>\n<td>內力＋20<\/td>\n<td>戰鬥與內功準備<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">2<\/td>\n<td>體力＋10<\/td>\n<td>基本生存；低體力收集檔可暫緩<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\">1<\/td>\n<td>學問＋5<\/td>\n<td>秘笈學習準備<\/td>\n<\/tr>\n<tr>\n<td style=\"text-align: right;\"><strong>10<\/strong><\/td>\n<td><strong>保留命運<\/strong><\/td>\n<td>重骰與突發事件<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>這是可直接照填的<strong>保守預算<\/strong>，不是已實測最強戰鬥配法。若書的學問門檻還差一截，從武學或一般好感移點補足；不要買了武學卻沒有能讀的書。<\/p>\n<h3 id=\"guide-6\">62 點、預留大師兄逆天的示例<\/h3>\n<p>先鎖住 <strong>30 點不花<\/strong>。其餘 32 點可分成：銀兩 2、武學 8、本線女角好感 4、大師兄好感 2、二師兄好感 2、三師兄好感 2、內力 6、體力 4、學問 2。上限或既有好感使某項不必花滿時，退回保留額。<\/p>\n<p>這 30 點在途中也可能被重骰消耗。到大師兄的夢前要再次檢查餘額，不能只記得開局「留過 30」。<\/p>\n<h3 id=\"guide-7\">各路線調整<\/h3>\n<ul>\n<li><strong>夏侯蘭：<\/strong>女角預算給夏侯蘭，先確保拜師；雪山前持有酒，心上人與好感門檻不能靠戰鬥數值替代。<\/li>\n<li><strong>龍湘／客棧：<\/strong>投資龍湘，<strong>不要把葉雲裳好感提前拉到 30<\/strong>而失去客棧入口；安排錦香宮好感與性格檢定。<\/li>\n<li><strong>葉雲裳／青城：<\/strong>雲裳、三師兄、武學與購書資金優先；醫術 3、佛學 2及《九轉殘篇》滿級必須在各自期限前實際練出來。<\/li>\n<li><strong>小梅：<\/strong>小梅好感至少 35的路線準備；不要為了湊拜師而讓夏侯蘭前置干擾小梅送行。半雨屏要控制輸出並嘴攻，屬性過高也不代表可以無腦速殺。<\/li>\n<li><strong>郁竹：<\/strong>郁竹與返家前置優先，江陵前把好感準備到 40；先完成小梅的「折梅手」可保留新版額外劇情的選項，但不是一般郁竹結緣的必要條件。<\/li>\n<li><strong>低數值補漏：<\/strong>另開低道德、低體力、低二師兄好感存檔。不得把上述通用配點當作死亡全收集模板。<\/li>\n<\/ul>\n<h2 id=\"guide-8\">存檔骨架<\/h2>\n<p>「母檔」就是保留不覆蓋、可反覆分出去的存檔。下列是存檔標籤建議，並不假設遊戲能在每句對話中存檔；請在進入事件前最後一個可操作時點保存。<\/p>\n<div aria-label=\"可左右捲動的資料表\" class=\"table-wrap\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>標籤<\/th>\n<th>保留位置<\/th>\n<th>要保留的分歧<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A00<\/td>\n<td>第一個月首次自由活動<\/td>\n<td>初遇死亡、照鏡子、低能力隨機死亡<\/td>\n<\/tr>\n<tr>\n<td>A10<\/td>\n<td>第一年八月，葉氏傳聞事件前<\/td>\n<td>收留／不收留；事件期限<\/td>\n<\/tr>\n<tr>\n<td>A20<\/td>\n<td>第一年十二月南宮壽宴前<\/td>\n<td>孤獨死、壽宴戰敗、魏菊／鐵琵琶功前置<\/td>\n<\/tr>\n<tr>\n<td>B00<\/td>\n<td>第二年二月月會前<\/td>\n<td>崆峒留學／不留學；留學需貢獻≥50<\/td>\n<\/tr>\n<tr>\n<td>B10<\/td>\n<td>崆峒選門派前<\/td>\n<td>奪魄拜師、飛天修仙及監獄、鐵拳返家<\/td>\n<\/tr>\n<tr>\n<td>B20<\/td>\n<td>第二年六月出走前<\/td>\n<td>客棧／破廟；先查雲裳好感及心上人<\/td>\n<\/tr>\n<tr>\n<td>B30<\/td>\n<td>第二年八月破廟密謀前<\/td>\n<td>裝死、跑路、叛門、報信、防守、青城<\/td>\n<\/tr>\n<tr>\n<td>B40<\/td>\n<td>第二年十月江陵決戰前夜<\/td>\n<td>小梅襄陽／郁竹收留／魏菊傳功<\/td>\n<\/tr>\n<tr>\n<td>B50<\/td>\n<td>第二年十二月下旬前<\/td>\n<td>掌門、二師兄好感分歧；召人／煉丹／背叛<\/td>\n<\/tr>\n<tr>\n<td>C00<\/td>\n<td>第三年一月大師兄事件前<\/td>\n<td>下山／留守、救治／收功、島上三結局<\/td>\n<\/tr>\n<tr>\n<td>C10<\/td>\n<td>第三年三月四師兄離去前<\/td>\n<td>行商五種汗青書；主幹留在唐門<\/td>\n<\/tr>\n<tr>\n<td>C20<\/td>\n<td>第三年五月招親前<\/td>\n<td>小師妹／雲裳／崆峒新線，群毆失敗群<\/td>\n<\/tr>\n<tr>\n<td>C30<\/td>\n<td>雪山行及傳功前<\/td>\n<td>雪山死亡、抵抗／接受、與花合葬<\/td>\n<\/tr>\n<tr>\n<td>C40<\/td>\n<td>武林大會出發前<\/td>\n<td>路途死亡、錦香宮、投票、雲裳同行<\/td>\n<\/tr>\n<tr>\n<td>C50<\/td>\n<td>第三年十一月，末段養成前<\/td>\n<td>調整戰術與學問、道德、伴侶及西武林前置<\/td>\n<\/tr>\n<tr>\n<td>C60<\/td>\n<td>第三年十二月決策前<\/td>\n<td>退隱／頑抗／西武林；並非所有選項都會同時開放<\/td>\n<\/tr>\n<tr>\n<td>D00<\/td>\n<td>第四年最終戰前<\/td>\n<td>戰死、盟主敗北／獲勝、伴侶結局<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>最容易誤規劃的點：西武林的前置成立後，退隱與頑抗選項可能被封閉。<\/strong>要從同一母檔分三個結局方向，應保留在戰術／學問及友人提案尚可控制的時段，不能只靠十二月會議前的一格存檔。<a href=\"https://smilin.net/LoM-wiki/event/simple/3-12-1-武林盟對策\" rel=\"noopener noreferrer\" target=\"_blank\">決策流程<\/a><\/p>\n<p>每次重開前看核對表：若只差一個就到 5 的倍數，且能用現有檔短時間補齊，先補；若要重跑半年以上，不應只為了湊整數而延後主線。<\/p>", "toc": [{"id": "guide-0", "title": "本攻略的固定前提", "level": 2}, {"id": "guide-1", "title": "先理解哪些東西跨周目保存", "level": 2}, {"id": "guide-2", "title": "推薦路線順序", "level": 2}, {"id": "guide-3", "title": "A 階段：真正的零存檔開局", "level": 2}, {"id": "guide-4", "title": "繼承配點：先買路線門檻，再買效率", "level": 2}, {"id": "guide-5", "title": "32 點的小師妹主幹示例", "level": 3}, {"id": "guide-6", "title": "62 點、預留大師兄逆天的示例", "level": 3}, {"id": "guide-7", "title": "各路線調整", "level": 3}, {"id": "guide-8", "title": "存檔骨架", "level": 2}]}, "routes": {"html": "\n<p>固定前提：<strong>普通模式＋序章取得30命運，以看劇情與三書全收集為目標<\/strong>。先依<a href=\"#controls\">數值控管表<\/a>分低值支檔，再養高值主幹；好感、道德、體力與門派規模不採一律點滿。<\/p>\n<p>使用方式：先依<a href=\"#guide\">推薦流程<\/a>養成，在本頁的期限前檢查條件，再用<a href=\"#collection\">核對表<\/a>收同區域的失敗結局。以下日期都是遊戲內年份。數值為原始好感，不以星數估算。這是關鍵節點攻略，並非逐旬固定行動表；隨機事件和骰子仍可能需要回讀。<\/p>\n<h2 id=\"routes-0\">共用終局：把一條人物線分成三個方向<\/h2>\n<div aria-label=\"可左右捲動的資料表\" class=\"table-wrap\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>分支<\/th>\n<th>操作重點<\/th>\n<th>主要收集<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>退隱<\/td>\n<td>在西武林條件未成立的母檔推動遣散；投票不合預期時須處理同票決鬥<\/td>\n<td>汗青 25–31、63–65 等；伴侶、道德、去向會換結局<\/td>\n<\/tr>\n<tr>\n<td>頑抗<\/td>\n<td>推動作戰，守住唐門；最後與盟主決鬥<\/td>\n<td>防守敗北：汗青 35＋風雲 10；盟主敗北：36；獲勝：37–46；風雲 15<\/td>\n<\/tr>\n<tr>\n<td>西武林<\/td>\n<td>先解提案入口，再守住外堡、大院，完成眉山決戰<\/td>\n<td>盟主敗北：汗青 47；獲勝：48＋風雲 16＋本線伴侶成就<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>自己提出西武林的路徑，要先完成金烏之死，並準備「戰術≥8」或「戰術≥5 且學問≥60」。另一條入口是從友人取得王幫主遺策。<strong>要收退隱／頑抗，請保留在這些條件尚未鎖定前的檔。<\/strong>提案、投票及友人條件詳見<a href=\"https://smilin.net/LoM-wiki/event/simple/3-12-1-武林盟對策\" rel=\"noopener noreferrer\" target=\"_blank\">武林盟對策<\/a>及<a href=\"https://smilin.net/LoM-wiki/event/simple/3-12-1-集思廣益\" rel=\"noopener noreferrer\" target=\"_blank\">集思廣益<\/a>。<\/p>\n<p>每位伴侶都優先做單一結緣的母檔。西武林結尾的實際檢查順序是小師妹 → 龍湘 → 夏侯蘭 → 葉雲裳 → 小梅 → 郁竹；前面成立，後面不再頒發。滅門結尾又有另一組優先序，多人結緣容易讓目標結局被替換。<\/p>\n<h2 id=\"routes-1\">小師妹：適合作為第一條主幹<\/h2>\n<ol>\n<li>心上人維持小師妹；第三年五月上旬前好感至少 50，並保留招親前檔。<\/li>\n<li>招親時進入與金烏相關的後續並獲勝，後山表白骰到至少 50 的分支；結緣判定還需好感至少 60。<\/li>\n<li>以取得香囊確認結緣成功，再延伸終局。<\/li>\n<li>頑抗獲勝收汗青 37「唐門薪火」；西武林獲勝收風雲 13「唐門女婿」。退隱與行商另外回讀，不要拿結緣主檔提前離開。<\/li>\n<\/ol>\n<p>行商分支留在第三年三月四師兄離去前；小師妹是否留在門內、約束旗標、好感會改變同行結果。汗青 12–14 各自核對，不能把相同畫面差分當作新增編號。<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl0\" rel=\"noopener noreferrer\" target=\"_blank\">小師妹流程來源<\/a><\/p>\n<h2 id=\"routes-2\">夏侯蘭：把雪山事件集中處理<\/h2>\n<ol>\n<li>第二年二月前貢獻至少 50，申請崆峒留學，三月選奪魄門。<\/li>\n<li>四月失竊事件替她辯解，骰到大於 50；峨嵋連戰第一場勝、第二場敗或撐五回合平手，後續選擇拜謝師禮。<\/li>\n<li>第三年五月下旬前夏侯蘭好感至少 40，完成樹屋相關事件；六月上旬赴雪山時心上人為她，身上有酒。<\/li>\n<li>七月中旬傳功時，三次選項都抵抗，四次骰子機會中至少一次到 99，再戰勝夏侯蘭，取得髮帶。第二次抵抗需要酒、第三次需要心上人為蘭；沒有收束時，好感至少 49 是重要準備。<\/li>\n<li>結緣後，西武林獲勝收風雲 12；頑抗獲勝收汗青 43。退隱高道德分支可收 31。<\/li>\n<\/ol>\n<p>雪山出發前、復仇前、傳功前各保留一檔。先分出去收生死 67、71–74，再回主線；汗青 22、23、34 也在這組事件補。不同選項可能直接結束旅程，先收失敗再回讀。<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl5\" rel=\"noopener noreferrer\" target=\"_blank\">夏侯蘭流程來源<\/a><\/p>\n<h2 id=\"routes-3\">龍湘：客棧收集與結緣可合併規劃<\/h2>\n<ol>\n<li>第二年不留學。若葉雲裳已在唐門，六月前把她好感維持在 30 以下，以保留客棧入口；這是收客棧項目的規劃，並非龍湘結緣本身必須住客棧。<\/li>\n<li>第三年九月下旬至十月上旬，龍湘好感至少 40，完成錦香宮夜遊；十月中旬以至少 30 好感收留她。<\/li>\n<li>十一月中旬起，心上人設龍湘，到後山挑柴觸發練劍。依序談初識、錦香宮、她的心事和心魔，告白；性格與骰子會影響如何問出心事。<\/li>\n<li>不走遣散。好感準備到 60，於頑抗線第三年十二月下旬或西武林線第四年一月下旬取得髮簪。<\/li>\n<li>頑抗獲勝收汗青 44；西武林獲勝收風雲 14。<\/li>\n<\/ol>\n<p>同組可收風雲 8、4與客棧生死 50–54。另留「已與他人結緣、心上人改龍湘」的退隱支檔，邀她同行、決鬥勝利並堅持挽留，可查汗青 24。<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl8\" rel=\"noopener noreferrer\" target=\"_blank\">龍湘流程來源<\/a><\/p>\n<h2 id=\"routes-4\">葉雲裳：期限最多，先排書與技能<\/h2>\n<div aria-label=\"可左右捲動的資料表\" class=\"table-wrap\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>時點<\/th>\n<th>必做檢查<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>第一年八月以後<\/td>\n<td>三師兄好感 25 或購買三份江湖快報取得葉氏傳聞；一個月內、名聲至少 10 時在大門完成收留<\/td>\n<\/tr>\n<tr>\n<td>第二年二月、六月<\/td>\n<td>不留學；六月走破廟。雲裳在門且好感≥30 會導向此線<\/td>\n<\/tr>\n<tr>\n<td>第二年八月中旬<\/td>\n<td>密謀事件不叛門、不逃跑；報信守唐門，心上人為雲裳，接青城<\/td>\n<\/tr>\n<tr>\n<td>第二年十二月上旬<\/td>\n<td>雲裳好感≥30、醫術≥3，拿到聞寂滅相關前置<\/td>\n<\/tr>\n<tr>\n<td>第三年一月<\/td>\n<td>心上人雲裳，骰到≥80 留住；取得九轉殘篇，預先備佛學 2<\/td>\n<\/tr>\n<tr>\n<td>第三年五月前<\/td>\n<td>九轉殘篇練滿，雲裳好感≥50，心上人不變<\/td>\n<\/tr>\n<tr>\n<td>招親與療傷<\/td>\n<td>對雲裳連續三次選軟性對策；若進入鐵冠戰，要撐至少四回合再敗，內力檢定骰≥40，幻境各戰全勝，最後取得梳子<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>鐵冠前一定保留檔：太早輸是生死 103；直接贏會轉汗青 7，不能當作救雲裳的成功流程。幻境失敗收汗青 54，谷底毒草低道德支線可查生死 104。<\/p>\n<p>成功結緣後，頑抗獲勝收汗青 38；西武林獲勝收風雲 18。武林大會唐門公敵分支讓雲裳同行，可收風雲 19。破廟、青城另用表中編號 92–105 分檔補，尤其申屠龍獲勝會因道德分成汗青 53 與生死 95。<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl2\" rel=\"noopener noreferrer\" target=\"_blank\">葉雲裳流程來源<\/a><\/p>\n<h2 id=\"routes-5\">小梅與郁竹：共用早期留學，但後半要分流<\/h2>\n<p>先留「第二年二月前」母檔。兩線都要處理郁竹返家：可用鐵拳門拜訪四次、郁竹好感至少 20並備兩次行動的入口；另一路從認識郁竹、小梅好感至少 20的事件追擊余公子並勝利。<strong>完成返家事件後再留一個母檔<\/strong>，不要把只見過郁竹誤當已完成返家。<\/p>\n<h3 id=\"routes-6\">虞小梅<\/h3>\n<ol>\n<li>留學期間小梅好感準備到 35以上，心上人為她。若要用小梅送行前置，避免夏侯蘭拜師及郁竹心上人分支搶走事件。<\/li>\n<li>第二年十月夜間打拳／散心接小梅，送行前置或處世＜40是入口之一；葉家兄妹在門與否另有練功、心相分歧。選擇跟她去襄陽。女飛賊事件可能扣好感，判定前仍需 35。<\/li>\n<li>第三年五月心上人小梅，金烏戰勝利；若走偷襲分支需躲過≥90檢定。郁城事件決定前去崆峒。<\/li>\n<li>保護郁城方向要打贏；後續勝過荊紅。半雨屏第一場對梅獲勝或撐到八回合；第二場累積至少四次嘴攻並存活，勿過早擊倒她。六次嘴攻有結束機制，十五回合後留意反噬。<\/li>\n<li>探望時給她自由去處，拒絕掌派人之位，確認取得髮帶後回主線。西武林獲勝收風雲 20；頑抗獲勝收汗青 40。<\/li>\n<\/ol>\n<p>半雨屏前分檔收汗青 57／58；探望及掌派人決策前分檔收 60／61；退隱再查 64／65。這些新版分支的終點已找到遊戲呼叫，但完整零存檔路線仍未實機逐項驗證。<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl3\" rel=\"noopener noreferrer\" target=\"_blank\">小梅流程來源<\/a><\/p>\n<h3 id=\"routes-7\">郁竹<\/h3>\n<ol>\n<li>完成返家後，第二年八月前好感至少 30，建議直接準備 40，心上人設郁竹。<\/li>\n<li>第二年十月南宮訃音時維持心上人郁竹、好感至少 40，完成收留；這一檔不要走小梅襄陽分支。<\/li>\n<li>第三年五月仍以郁竹為心上人，戰勝金烏，避免偷襲路徑；郁城事件選擇前去。<\/li>\n<li>勝過荊紅、不逃離；打贏崆峒弟子，金烏戰在十五回合前獲勝。<\/li>\n<li>探望時選「我有得選」，拒絕掌派人之位，確認取得手帕。西武林獲勝收風雲 21；頑抗獲勝收汗青 41。<\/li>\n<\/ol>\n<p>可分出去收汗青 55、56、59、62、63、66；其中 62 的新家來自另一段居家選擇，不能假定結緣自動附送。66則是西武林「全力固守外堡」戰役獲勝後，進入郁竹的終結分支；戰敗會先轉33，並非66。其他更高優先旗標可能覆蓋，保留該決策前檔。新版的「已取得折梅手＋持有 50命運」是額外事件條件，不列為普通結緣必要門檻。高道德退隱在目前腳本導向汗青 63「醜神仙」；舊攻略寫 29「再世龐統」時不要照單全收。<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl6\" rel=\"noopener noreferrer\" target=\"_blank\">郁竹流程來源<\/a><\/p>\n<h2 id=\"routes-8\">飛俠歸來：先決定用點數或救治<\/h2>\n<p>最方便排預算的是第三年一月跟大師兄下山；若沒達自然生還條件，在後山夢境前保有 <strong>30命運<\/strong>，選擇希望他活下來。自然生還則要求沒有被金烏敲暈，且「名聲≥50 且道德≥80」或「認識申屠龍且好感≥30」。<\/p>\n<p>留在唐門的替代方案：醫術≥5 或累積煉丹消費≥250，亦可走泥教弟子告知的救治入口。願意治療後，以治療前內力計算：<\/p>\n<div aria-label=\"可左右捲動的資料表\" class=\"table-wrap\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>南宮護心訣<\/th>\n<th style=\"text-align: right;\">初始內力<\/th>\n<th style=\"text-align: right;\">生存點<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>未達技能 3<\/td>\n<td style=\"text-align: right;\">≥55／＜55<\/td>\n<td style=\"text-align: right;\">2／1<\/td>\n<\/tr>\n<tr>\n<td>技能 3<\/td>\n<td style=\"text-align: right;\">≥53／28–52／＜28<\/td>\n<td style=\"text-align: right;\">3／2／1<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>小梅不在時，收功減一點，不收功不減；小梅在且收功會被帶去孤島。小梅在而不收功，還要郁竹在唐門或小梅好感≥40，否則仍轉孤島。最終生存點至少 2 才能生還。<\/p>\n<p>救治成功當下不等於拿到成就。西武林要等第四年二月中旬歸來；頑抗要無結緣對象、終戰獲勝，接汗青 46才能看到對應回歸。若同時收「師門砥柱」，還要看過金烏假死並在招親殺掉他；有些最安全的留守治療選項不會讓趙活看見假死。<a href=\"https://smilin.net/LoM-wiki/event/detailed_description/4-02-2-飛俠歸來\" rel=\"noopener noreferrer\" target=\"_blank\">飛俠流程來源<\/a><\/p>\n<h2 id=\"routes-9\">實際補漏順序<\/h2>\n<p>每到一個母檔，先把同事件的短死亡／提早結局完成並回讀，再走長主線。先做會永久改寫入口的選擇之前的支檔：葉家收留、留學門派、客棧與破廟、襄陽與收留郁竹、招親心上人、西武林提案。<\/p>\n<p>生死 22–25、55–57，以及上官／魏菊保留結緣項目，不放進必要行程。核對表標「待查」的條目表示目前只有終點或部分入口證據，尚不足以給你保證能照做的完整路線。<\/p>", "toc": [{"id": "routes-0", "title": "共用終局：把一條人物線分成三個方向", "level": 2}, {"id": "routes-1", "title": "小師妹：適合作為第一條主幹", "level": 2}, {"id": "routes-2", "title": "夏侯蘭：把雪山事件集中處理", "level": 2}, {"id": "routes-3", "title": "龍湘：客棧收集與結緣可合併規劃", "level": 2}, {"id": "routes-4", "title": "葉雲裳：期限最多，先排書與技能", "level": 2}, {"id": "routes-5", "title": "小梅與郁竹：共用早期留學，但後半要分流", "level": 2}, {"id": "routes-6", "title": "虞小梅", "level": 3}, {"id": "routes-7", "title": "郁竹", "level": 3}, {"id": "routes-8", "title": "飛俠歸來：先決定用點數或救治", "level": 2}, {"id": "routes-9", "title": "實際補漏順序", "level": 2}]}, "sources": {"html": "\n<h2 id=\"sources-0\">基準與來源<\/h2>\n<p>本稿以全新帳本、無MOD的正常遊玩為目標，不沿用任何玩家存檔。核對日期2026-10-24，含完整劇透。<\/p>\n<div aria-label=\"可左右捲動的資料表\" class=\"table-wrap\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>項目<\/th>\n<th>本次讀到的值<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>遊戲<\/td>\n<td>活俠傳／Legend of Mortal，Steam App 1859910<\/td>\n<\/tr>\n<tr>\n<td>Steam buildid<\/td>\n<td><code>26073097<\/code><\/td>\n<\/tr>\n<tr>\n<td>遊戲內部版本<\/td>\n<td><code>release_1.0.6000.5<\/code>，取自PlayerSettings<\/td>\n<\/tr>\n<tr>\n<td>Unity版本<\/td>\n<td><code>2020.3.49f1<\/code><\/td>\n<\/tr>\n<tr>\n<td>語系<\/td>\n<td>繁體中文資源映射<\/td>\n<\/tr>\n<tr>\n<td>社群資料快照<\/td>\n<td><a href=\"https://github.com/Mr-Smilin/LoM-wiki\" rel=\"noopener noreferrer\" target=\"_blank\">Mr-Smilin/LoM-wiki<\/a>，提交 <code>c3b4ab21b5aa8c30296e7abc3c4365a2bc089dcc<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>讀取對象是遊戲的資源與程式資料；未修改遊戲、未讀寫玩家存檔，也未用MOD觸發內容。安裝目錄存在額外工具檔案，本稿沒有採用它們的功能；未執行Steam完整性驗證，故本機版本指紋不能代替與官方原檔逐位元核對。<\/p>\n<h2 id=\"sources-1\">各種結論是怎麼得到的<\/h2>\n<div aria-label=\"可左右捲動的資料表\" class=\"table-wrap\" role=\"region\" tabindex=\"0\"><table>\n<thead>\n<tr>\n<th>結論<\/th>\n<th>證據<\/th>\n<th>能證明到哪裡<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>122生死、66汗青、22風雲<\/td>\n<td>LibraryItemCollection三份名冊與繁中標題<\/td>\n<td>登錄總數，不代表全可取得<\/td>\n<\/tr>\n<tr>\n<td>201項有終點引用<\/td>\n<td>繁中Lua中的GameOver、endgamepanel、AddAchievementLib，及CombatLevel死亡結果<\/td>\n<td>存在通往該結果的資料，不證明整條前置可達<\/td>\n<\/tr>\n<tr>\n<td>全局紀錄與劇情檔分開<\/td>\n<td>LibrarySystem.Save/Load、SaveSystem.SaveUniverseData<\/td>\n<td>回讀劇情與全局收集是不同資料路徑<\/td>\n<\/tr>\n<tr>\n<td>首次繼承要求命中有數<\/td>\n<td>SaveSystem.NewGameData檢查成就30000.Count<\/td>\n<td>提早結局不能一律當作完成首輪<\/td>\n<\/tr>\n<tr>\n<td>點數門檻及配點增量<\/td>\n<td>LibraryAwardData、FateBonusPanel及各配點prefab<\/td>\n<td>配點數值可查；本文預算仍是規劃建議<\/td>\n<\/tr>\n<tr>\n<td>伴侶成就互斥<\/td>\n<td>ch8_8_1中六個elseif分支<\/td>\n<td>同次執行只頒發一個；不是每個已結緣者都頒發<\/td>\n<\/tr>\n<tr>\n<td>郁竹高道德退隱改到63<\/td>\n<td>ch7_5_2_9呼叫20062；未找到20028直接呼叫<\/td>\n<td>當前該分支不是舊汗青29；不排除另有尚未解析入口<\/td>\n<\/tr>\n<tr>\n<td>日期、一般養成入口與實用路線<\/td>\n<td>wiki的逐事件頁、六女角路線，與本機終點比對<\/td>\n<td>社群流程交叉整理，非此次實機從零逐條驗證<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<h3 id=\"sources-2\">收集何時寫入<\/h3>\n<p>汗青結局面板開啟時呼叫LibraryItemData.Add與SaveUniverseData；GameOver死亡畫面同樣增加紀錄並寫入全局資料；風雲史的AddAchievementLib在新增後也呼叫SaveUniverseData。因此可規劃「取得→確認登錄→回讀分歧前」的收集方式。不要在事件尚未到這個階段時就跳出。<\/p>\n<p>新開局才執行繼承獎勵。取得更多成就後回讀舊劇情檔，不會等同重建該檔的初始繼承數值。本文沒有用刪檔、改全局紀錄或外部解鎖方式來補項目。<\/p>\n<h3 id=\"sources-3\">暫不列入必要行程的項目<\/h3>\n<p><strong>此次未找到直接終點引用的9項：<\/strong>生死3、64、70、75、122；汗青1、2、3、29。這是「本次方法未找到」，不是嚴格證明遊戲永遠不可能取得。<\/p>\n<p>另有終點存在、入口仍未確認開放的內容：舊act系列的生死22–25；綁架出海的生死55–57與汗青18；上官／魏菊保留結緣的生死89–90與汗青30、39、42。詳見核對表，不把這些列進強制重跑清單。<\/p>\n<p>新版的地牢小梅、崆峒之變等資料已經出現。不能把舊攻略的「未開放」一律套到新版，也不能反過來把新增終點當作整條路線已驗證；因此個別項目保留「新版待跑」或「待查」。<\/p>\n<h2 id=\"sources-4\">本次未完成的驗證<\/h2>\n<ul>\n<li>沒有逐條啟動遊戲實跑，也沒有測試每一組戰鬥勝敗或隨機事件。<\/li>\n<li>沒有建立可完整模擬遊戲的事件求解器，未證明最少周目、最少旬數或最少讀檔。<\/li>\n<li>解析主要MonoBehaviour時有8筆型別解析錯誤，包含部分屬性資料；未解析部分不能當作已知零值。<\/li>\n<li>靜態引用搜尋可能漏掉動態拼接、非Lua呼叫或未涵蓋資源；CombatLevel有死亡結果也可能沒有現行入口。<\/li>\n<li>同名腳本存在不同語系版本；本稿以ResourceManager的繁中映射重建，未混用同名簡體腳本。<\/li>\n<li>目前提供的是關鍵期限、門檻、存檔與分支的攻略；尚未提供一套經實測可完全照抄的逐旬行動清單。<\/li>\n<\/ul>\n<p>因此可使用本文規劃主幹與補漏，但不能宣稱「210項全部現在可拿」或「照表一定零失誤全成就」。<\/p>\n<h2 id=\"sources-5\">社群流程來源<\/h2>\n<p>主要索引：<a href=\"https://smilin.net/LoM-wiki/event/ends/\" rel=\"noopener noreferrer\" target=\"_blank\">汗青書<\/a>、<a href=\"https://smilin.net/LoM-wiki/event/badends/\" rel=\"noopener noreferrer\" target=\"_blank\">生死簿<\/a>、<a href=\"https://smilin.net/LoM-wiki/event/achievements/\" rel=\"noopener noreferrer\" target=\"_blank\">風雲史<\/a>。<\/p>\n<p>人物流程：<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl0\" rel=\"noopener noreferrer\" target=\"_blank\">小師妹<\/a>、<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl2\" rel=\"noopener noreferrer\" target=\"_blank\">葉雲裳<\/a>、<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl3\" rel=\"noopener noreferrer\" target=\"_blank\">虞小梅<\/a>、<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl5\" rel=\"noopener noreferrer\" target=\"_blank\">夏侯蘭<\/a>、<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl6\" rel=\"noopener noreferrer\" target=\"_blank\">郁竹<\/a>、<a href=\"https://smilin.net/LoM-wiki/event/pursuit/girl8\" rel=\"noopener noreferrer\" target=\"_blank\">龍湘<\/a>。<\/p>\n<p>主線關鍵：<a href=\"https://smilin.net/LoM-wiki/event/detailed_description/4-02-2-飛俠歸來\" rel=\"noopener noreferrer\" target=\"_blank\">飛俠歸來<\/a>、<a href=\"https://smilin.net/LoM-wiki/event/simple/3-12-1-武林盟對策\" rel=\"noopener noreferrer\" target=\"_blank\">武林盟對策<\/a>、<a href=\"https://smilin.net/LoM-wiki/event/simple/3-12-1-集思廣益\" rel=\"noopener noreferrer\" target=\"_blank\">集思廣益<\/a>。<\/p>\n<p>以上是參考資料，並非遊戲製作方對本攻略的認證。若更新後發現選項、門檻或結局不同，先比對版本，再回頭檢查對應腳本與前置旗標。<\/p>", "toc": [{"id": "sources-0", "title": "基準與來源", "level": 2}, {"id": "sources-1", "title": "各種結論是怎麼得到的", "level": 2}, {"id": "sources-2", "title": "收集何時寫入", "level": 3}, {"id": "sources-3", "title": "暫不列入必要行程的項目", "level": 3}, {"id": "sources-4", "title": "本次未完成的驗證", "level": 2}, {"id": "sources-5", "title": "社群流程來源", "level": 2}]}}, "slots": [{"id": "A00", "when": "第一個月首次自由活動", "purpose": "初遇死亡、照鏡子、低能力隨機死亡"}, {"id": "A10", "when": "第一年八月，葉氏傳聞事件前", "purpose": "收留／不收留；事件期限"}, {"id": "A20", "when": "第一年十二月南宮壽宴前", "purpose": "孤獨死、壽宴戰敗、魏菊／鐵琵琶功前置"}, {"id": "B00", "when": "第二年二月月會前", "purpose": "崆峒留學／不留學；留學需貢獻≥50"}, {"id": "B10", "when": "崆峒選門派前", "purpose": "奪魄拜師、飛天修仙及監獄、鐵拳返家"}, {"id": "B20", "when": "第二年六月出走前", "purpose": "客棧／破廟；先查雲裳好感及心上人"}, {"id": "B30", "when": "第二年八月破廟密謀前", "purpose": "裝死、跑路、叛門、報信、防守、青城"}, {"id": "B40", "when": "第二年十月江陵決戰前夜", "purpose": "小梅襄陽／郁竹收留／魏菊傳功"}, {"id": "B50", "when": "第二年十二月下旬前", "purpose": "掌門、二師兄好感分歧；召人／煉丹／背叛"}, {"id": "C00", "when": "第三年一月大師兄事件前", "purpose": "下山／留守、救治／收功、島上三結局"}, {"id": "C10", "when": "第三年三月四師兄離去前", "purpose": "行商五種汗青書；主幹留在唐門"}, {"id": "C20", "when": "第三年五月招親前", "purpose": "小師妹／雲裳／崆峒新線，群毆失敗群"}, {"id": "C30", "when": "雪山行及傳功前", "purpose": "雪山死亡、抵抗／接受、與花合葬"}, {"id": "C40", "when": "武林大會出發前", "purpose": "路途死亡、錦香宮、投票、雲裳同行"}, {"id": "C50", "when": "第三年十一月，末段養成前", "purpose": "調整戰術與學問、道德、伴侶及西武林前置"}, {"id": "C60", "when": "第三年十二月決策前", "purpose": "退隱／頑抗／西武林；並非所有選項都會同時開放"}, {"id": "D00", "when": "第四年最終戰前", "purpose": "戰死、盟主敗北／獲勝、伴侶結局"}], "version": "release_1.0.6000.5", "date": "2026-10-26", "planner": {"events": [{"key": "profile", "time": "開局前", "title": "這次從什麼基礎出發？", "body": "先按實際帳本選擇。沒有「命中有數」時，無法使用繼承配點；網路上的32點或額外行動流程不能直接套在首輪。", "options": [{"value": "fresh", "label": "全新帳本／沒有繼承", "effect": "先以命中有數＋最後的暗器為主幹；遊戲沒有開局配點介面。"}, {"value": "plus", "label": "已有命中有數／繼承開局", "effect": "先到開局配點試算；32點示例保留10，62點示例保留30命運。"}], "save": "", "when": {}, "risks": []}, {"key": "difficulty", "time": "第一年四月 · 開局", "title": "固定普通模式", "body": "本攻略只為看劇情與三書收集，不安排困難模式挑戰。普通模式是所有工作階段的固定前提。", "options": [{"value": "normal", "label": "普通模式（攻略固定前提）", "effect": "開局取得3命運；這筆在繼承配點之後到手。"}], "save": "", "when": {}, "risks": []}, {"key": "mirror", "time": "第一年四月 · 首次弟子房", "title": "照鏡子：先補一項短成就", "body": "先在可存檔時留A00。想兼顧鏡子選項，可取得成就後回讀；網站不會自動把它勾成已收集。", "options": [{"value": "self", "label": "先取得「自戀」", "effect": "肯定自己的長相，確認風雲05已登錄；回讀後可選另一個方向。"}, {"value": "other", "label": "選其他鏡子回應", "effect": "不影響主線結局；之後可另從變心夢入口補自戀。"}], "save": "A00", "when": {}, "risks": ["30005"]}, {"key": "opening", "time": "第一年六月上旬 · 吐血", "title": "主幹固定取得30命運", "body": "選希望人間不要這麼險惡。睡死與特殊故事只在補收集的支檔處理，完成後回讀這條30命運主幹。", "options": [{"value": "hope", "label": "希望人間不要這麼險惡（主幹固定）", "effect": "取得30命運並繼續。這不是繼承配點，也不是任何時刻都還剩30；途中花用後看實際餘額。"}, {"value": "sleep", "label": "補收集支檔：不活了 → 睡死", "effect": "汗青06提早結局；取得後回讀A00，主幹仍選30命運，且睡死不解鎖首次繼承。"}, {"value": "special", "label": "補劇情支檔：不用努力就變厲害", "effect": "進正式 function cleanAnswers(v){const result={};for(const e of PLAN.events)if(e.options.some(o=>o.value===v?.[e.key]))result[e.key]=v[e.key];if(v?.difficulty==='hard')result.difficulty='hard';if(v?.opening==='live')result.opening='live';return result;}

function terminalRecord(a){
 if(a.opening==='sleep')return {id:'20005',at:'opening'};
 const immediate={cloudheal:{failed:'20053',ironwin:'20006'},kongtong:{escape:'20055',meifail:'20056',meiwrong:'20057',bambooother:'20058',control:'20059',leader:'20060'},holdresult:{lose:'20032'},defense:{lose:'20034'}};
 for(const e of PLAN.events){const id=immediate[e.key]?.[a[e.key]];if(id)return {id,at:e.key};}
 return null;
}
function eventAvailability(e,a,seen=[]){
 if(!e||seen.includes(e.key))return false;
 const index=PLAN.events.indexOf(e),stop=terminalRecord(a);if(stop&&index>PLAN.events.findIndex(x=>x.key===stop.at))return false;
 if(a.opening==='special'&&index>PLAN.events.findIndex(x=>x.key==='opening'))return false;
 if(a.trade==='leave'&&index>PLAN.events.findIndex(x=>x.key==='trade'))return false;
 let pending=false;
 for(const [key,allowed] of Object.entries(e.when)){
   const upstream=eventAvailability(EVENT_MAP[key],a,[...seen,e.key]);
   if(upstream===false)return false;
   if(upstream===null)pending=true;
   if(a[key]&&!allowed.includes(a[key]))return false;
   if(!a[key])pending=true;
 }
 if(e.key==='finalbattle'){
   if(!a.finalroute)return null;
   if(a.finalroute==='retreat')return false;
   if(a.finalroute==='western'){if(a.hold==='hold')return false;if(!a.hold)return null;}
   if(a.finalroute==='resist'){if(a.defense==='lose')return false;if(!a.defense)return null;}
 }
 return pending?null:true;
}
function modelFor(item){return item.category==='汗青書'?PLAN.models[String(item.number)]:PLAN.achievements[item.id];}
function evaluateModel(item,a){
 const model=modelFor(item), conflicts=[],missing=[];
 if(item.status==='暫不列入')return {kind:'reserved',conflicts,missing,model};
 const stop=terminalRecord(a);
 if(stop)return {kind:item.id===stop.id?'compatible':'conflict',conflicts:item.id===stop.id?[]:[{key:stop.at,reason:'已記錄另一個提早結局；要繼續其他分支需回讀。'}],missing,model};
 if(a.opening==='special')return {kind:'unknown',conflicts,missing,model};
 if(!model)return {kind:'unknown',conflicts,missing,model};
 const earlyAt={6:'opening',7:'cloudheal',12:'trade',13:'trade',14:'trade',15:'trade',54:'cloudheal',55:'trade',56:'kongtong',57:'kongtong',58:'kongtong',59:'kongtong',60:'kongtong',61:'kongtong',33:'holdresult',35:'defense'};
 const cutoff=item.category==='汗青書'?earlyAt[item.number]:null;
 if(cutoff&&PLAN.events.slice(PLAN.events.findIndex(e=>e.key===cutoff)+1).some(e=>a[e.key]))conflicts.push({key:cutoff,reason:'已記錄後續事件；這個提早結局需回到較早存檔另走。'});
 for(const [key,allowed] of Object.entries(model.requirements)){
   const value=a[key];
   if(!value||(key==='partner'&&value==='multi'))missing.push({key,allowed});
   else if(!allowed.includes(value))conflicts.push({key,allowed,reason:`${EVENT_MAP[key].title}：已記錄「${EVENT_MAP[key].options.find(o=>o.value===value)?.label||value}」`});
 }
 if(a.trade==='leave'&&!['20011','20012','20013','20014','20054'].includes(item.id))conflicts.push({key:'trade',reason:'已選行商離開；本次長線在這裡結束。'});
 return {kind:conflicts.length?'conflict':'compatible',conflicts,missing,model};
}
function plannerResults(a){return DATA.items.filter(x=>x.category==='汗青書').map(item=>({item,...evaluateModel(item,a)}));}

function validState(v){

  s.planner=cleanPlanner(v.planner);s.walk=cleanWalk(v.walk);
  for(const [id,n] of Object.entries(v.notes||{}))if(IDS.has(id)&&typeof n==='string')s.notes[id]=n.slice(0,4000);
  for(const row of DATA.slots){const x=v.saves?.[row.id];if(x&&typeof x==='object')s.saves[row.id]={done:x.done===true,note:typeof x.note==='string'?x.note.slice(0,4000):''};}

}

 const category=e.target.closest('[data-category]');if(category){filters.category=category.dataset.category;pageNo=1;}
 const pager=e.target.closest('[data-pager]');if(pager){pageNo+=Number(pager.dataset.pager);renderCards();$('#search').scrollIntoView({block:'start'});return;}
 const preset=e.target.closest('[data-preset]');if(preset){const n=Number(preset.dataset.preset);if(n===0)state.budget.alloc={};else{state.budget={ends:n===32?5:10,deaths:n===32?5:10,unlocked:true,alloc:n===32?{money:2,martial:6,heroine:3,brotherc:2,brotherb:2,internal:4,life:2,literacy:1}:{money:2,martial:8,heroine:4,brothera:2,brotherb:2,brotherc:2,internal:6,life:4,literacy:2}};}persist();build();toast(n?'已套用示例預算':'已清空配置');}
 if(e.target.closest('[data-detail-route]'))$('#detail').close();
});
document.addEventListener('change',e=>{if(e.target.matches('[data-done]')){toggleList('done',e.target.dataset.done,e.target.checked);refreshCurrent();}if(e.target.matches('[data-save]')){const id=e.target.dataset.save;state.saves[id]={...state.saves[id],done:e.target.checked};persist();const n=DATA.slots.filter(x=>state.saves[x.id]?.done).length;$('.page-title p').textContent=`已記錄 ${n} / ${DATA.slots.length} 個存檔節點。標籤供你對照遊戲存檔；這裡不會存取或建立遊戲檔案。`;}});
$('#detail').addEventListener('click',e=>{if(e.target===$('#detail')){const b=e.target.getBoundingClientRect();if(e.clientX<b.left||e.clientX>b.right||e.clientY<b.top||e.clientY>b.bottom)e.target.close();}});
$('#detail').addEventListener('close',()=>{detailId=null;refreshCurrent();});
$('#theme').onclick=()=>{state.theme=state.theme==='dark'?'light':'dark';applyTheme();persist();};
$('#print').onclick=()=>{if(page==='collection'){toast('將列印目前篩選的這一頁收集卡片');setTimeout(()=>window.print(),150);}else window.print();};
$('#export').onclick=()=>{const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString(),gameVersion:DATA.version},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='活俠傳-收集進度-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);toast('進度備份已匯出');};
$('#import').onclick=()=>$('#import-file').click();
$('#import-file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>2000000)throw new Error('檔案過大');const imported=validState(JSON.parse(await f.text()));if(!window.confirm(`匯入 ${imported.done.length} 項已取得、${imported.pins.length} 項收藏與筆記？這會取代此瀏覽器的目前紀錄，建議先匯出備份。`))return;state=imported;applyTheme();persist();navigate();toast('備份匯入完成');}catch(error){toast('無法匯入：請選擇本攻略匯出的有效JSON備份');}finally{e.target.value='';}};
window.addEventListener('hashchange',navigate);
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=validState(JSON.parse(e.newValue));applyTheme();updateProgress();if(!$('#detail').open&&!['saves','build'].includes(page))navigate();}catch(err){}}});
applyTheme();storageMessage();updateProgress();navigate();
</script>
</body></html>
