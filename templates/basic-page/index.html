<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>頁面標題</title>
<style>
:root{--ink:#253443;--muted:#697785;--paper:#fff;--accent:#315b73;--bg:#eef3f6}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC","Microsoft JhengHei",sans-serif;line-height:1.7}
header{background:linear-gradient(135deg,#233a54,#567b98);color:white;padding:55px 20px}
.wrap{max-width:900px;margin:auto}
header a{color:rgba(255,255,255,.8);text-decoration:none}
h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.15;margin:18px 0 8px}
header p{margin:0;color:rgba(255,255,255,.82)}
main{padding:28px 18px 60px}
section{background:var(--paper);border-radius:22px;padding:24px;margin-bottom:18px;box-shadow:0 12px 35px rgba(35,58,84,.09)}
h2{margin-top:0}
.note{border-left:5px solid var(--accent);padding:12px 16px;background:#f4f8fa;border-radius:10px}
@media(max-width:600px){section{padding:20px}header{padding-top:42px}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a href="../../">← 回分享首頁</a>
    <h1>頁面標題</h1>
    <p>在這裡放一句簡短說明。</p>
  </div>
</header>
<main class="wrap">
  <section>
    <h2>第一個區塊</h2>
    <p>將內容放在這裡。可以加入文字、圖片、連結、表格或其他 HTML 元素。</p>
  </section>
  <section>
    <h2>第二個區塊</h2>
    <div class="note">這是一個提示區塊，可放重要資訊。</div>
  </section>
</main>
</body>
</html>
